name: Build/release

on: push

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: yarn

      - name: ESLint
        run: yarn lint

  release:
    needs: lint
    runs-on: ${{ matrix.os }}

    # Publishing uploads release assets with the workflow token.
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: win

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: yarn

      - name: Download binaries
        run: npm run download-binaries

      - name: Build
        run: yarn build
        env:
          SENTRY_URL: ${{ secrets.sentry_url }}
          SENTRY_ORG: ${{ secrets.sentry_org }}
          SENTRY_PROJECT: ${{ secrets.sentry_project }}
          SENTRY_AUTH_TOKEN: ${{ secrets.sentry_auth_token }}

      # Only a v* tag publishes; a macOS tag build fails without a signing certificate.
      - name: Package and publish
        shell: bash
        # electron-builder reads an empty CSC_LINK on macOS as a certificate path, so drop it when the secret is missing.
        run: |
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          yarn electron-builder --${{ matrix.platform }} \
            --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }} \
            ${{ matrix.platform == 'mac' && startsWith(github.ref, 'refs/tags/v') && '-c.forceCodeSigning=true' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.mac_certs || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.mac_certs_password || '' }}
          # macOS notarization API key
          APPLEID: ${{ secrets.apple_id }}
          APPLEIDPASS: ${{ secrets.apple_id_pass }}
          APPLEIDTEAM: ${{ secrets.apple_id_team }}
          SENTRY_URL: ${{ secrets.sentry_url }}
          SENTRY_ORG: ${{ secrets.sentry_org }}
          SENTRY_PROJECT: ${{ secrets.sentry_project }}
          SENTRY_AUTH_TOKEN: ${{ secrets.sentry_auth_token }}
