name: Shell build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: yarn

      - name: Compile the shell
        run: yarn build

      - name: Built shell is on disk
        run: |
          test -d out/main
          test -d out/preload
          test -d out/renderer
