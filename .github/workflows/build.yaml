name: Build/release

on:
  push:
  # A PR builds and, from a branch in this repo, signs and notarizes; it never publishes.
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: yarn

      - name: ESLint
        run: yarn lint

  release:
    needs: lint
    runs-on: ${{ matrix.os }}

    # Publishing uploads release assets with the workflow token.
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: win

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: yarn

      # lint.yaml runs the unit tests on Linux only; path handling differs on Windows and macOS.
      - name: Unit tests
        run: yarn test

      - name: Download binaries
        run: npm run download-binaries

      - name: Build
        run: yarn build
        env:
          SENTRY_URL: ${{ secrets.sentry_url }}
          SENTRY_ORG: ${{ secrets.sentry_org }}
          SENTRY_PROJECT: ${{ secrets.sentry_project }}
          SENTRY_AUTH_TOKEN: ${{ secrets.sentry_auth_token }}

      # GitHub gives no secrets to a PR from a fork, so its macOS build cannot sign.
      - name: Warn that a fork PR builds unsigned
        if: matrix.platform == 'mac' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::warning::PR from a fork; the macOS app is built unsigned and not notarized. Push the branch to ${{ github.repository }} to check signing."

      # Only a v* tag publishes. A macOS build from a tag or a same-repo PR fails unless it signs and notarizes.
      - name: Package and publish
        shell: bash
        # electron-builder reads an empty CSC_LINK on macOS as a certificate path, so drop it when the secret is missing.
        run: |
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          force=()
          [ "${{ matrix.platform }}" = mac ] && [ "$REQUIRE_NOTARIZE" = true ] && force=(-c.forceCodeSigning=true)
          yarn electron-builder --${{ matrix.platform }} \
            --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }} \
            "${force[@]}"
        env:
          REQUIRE_NOTARIZE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.mac_certs || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.mac_certs_password || '' }}
          # macOS notarization API key
          APPLEID: ${{ secrets.apple_id }}
          APPLEIDPASS: ${{ secrets.apple_id_pass }}
          APPLEIDTEAM: ${{ secrets.apple_id_team }}
          SENTRY_URL: ${{ secrets.sentry_url }}
          SENTRY_ORG: ${{ secrets.sentry_org }}
          SENTRY_PROJECT: ${{ secrets.sentry_project }}
          SENTRY_AUTH_TOKEN: ${{ secrets.sentry_auth_token }}
