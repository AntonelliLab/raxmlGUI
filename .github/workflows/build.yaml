name: Build/release

on:
  # Branches build through their PR; a push-run on every branch would duplicate it.
  push:
    branches: [master]
    tags: ['v*']
  # A PR builds and, from a branch in this repo, signs and notarizes; it never publishes.
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: yarn

      - name: ESLint
        run: yarn lint

  release:
    needs: lint
    runs-on: ${{ matrix.os }}

    # Publishing uploads release assets with the workflow token.
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: win

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: yarn

      # lint.yaml runs the unit tests on Linux only; path handling differs on Windows and macOS.
      - name: Unit tests
        run: yarn test

      - name: Download binaries
        run: npm run download-binaries

      - name: Build
        run: yarn build
        env:
          SENTRY_URL: ${{ secrets.sentry_url }}
          SENTRY_ORG: ${{ secrets.sentry_org }}
          SENTRY_PROJECT: ${{ secrets.sentry_project }}
          SENTRY_AUTH_TOKEN: ${{ secrets.sentry_auth_token }}

      # Only a v* tag publishes. A macOS build from a tag, or from a PR that has the signing secret, fails unless it signs and notarizes.
      - name: Package and publish
        shell: bash
        run: |
          signing=$REQUIRE_NOTARIZE
          if [ -n "$CSC_LINK" ]; then
            [ "$GITHUB_EVENT_NAME" = pull_request ] && signing=true
          else
            # electron-builder reads an empty CSC_LINK on macOS as a certificate path, so drop it.
            unset CSC_LINK CSC_KEY_PASSWORD
            # GitHub gives no Actions secrets to fork PRs or Dependabot runs; those build unsigned.
            if [ "${{ matrix.platform }}" = mac ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo "::warning::No signing secret in this run (fork or Dependabot PR); the macOS app is built unsigned and not notarized."
            fi
          fi
          force=()
          if [ "${{ matrix.platform }}" = mac ] && [ "$signing" = true ]; then
            force=(-c.forceCodeSigning=true)
            # electron-builder skips signing whenever GITHUB_BASE_REF is set, which it is on every PR.
            export CSC_FOR_PULL_REQUEST=true
          fi
          yarn electron-builder --${{ matrix.platform }} \
            --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }} \
            "${force[@]}"
        env:
          REQUIRE_NOTARIZE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.mac_certs || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.mac_certs_password || '' }}
          # macOS notarization API key
          APPLEID: ${{ secrets.apple_id }}
          APPLEIDPASS: ${{ secrets.apple_id_pass }}
          APPLEIDTEAM: ${{ secrets.apple_id_team }}
          SENTRY_URL: ${{ secrets.sentry_url }}
          SENTRY_ORG: ${{ secrets.sentry_org }}
          SENTRY_PROJECT: ${{ secrets.sentry_project }}
          SENTRY_AUTH_TOKEN: ${{ secrets.sentry_auth_token }}
