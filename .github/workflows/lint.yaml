name: Lint

on:
  pull_request:

jobs:
  eslint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: yarn

      - name: ESLint
        run: yarn lint

      - name: Typecheck baseline
        run: yarn typecheck:baseline

      - name: Page render test
        run: yarn react-test
