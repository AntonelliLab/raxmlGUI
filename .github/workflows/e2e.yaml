name: E2E tests

on:
  pull_request:
  # Manual only: writes this host's fixtures and uploads them. Nothing is committed.
  workflow_dispatch:
    inputs:
      host:
        description: Host to generate fixtures on
        type: choice
        options: [all, macos-15, ubuntu-24.04, windows-latest]
        default: all

jobs:
  e2e:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.host && inputs.host != 'all' && format('["{0}"]', inputs.host) || '["macos-15","ubuntu-24.04","windows-latest"]') }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: yarn

      - name: Download binaries
        run: yarn download-binaries

      - name: Install Electron system dependencies (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          npx playwright install-deps
          sudo apt-get install -y xvfb

      - name: Run e2e tests
        run: ${{ matrix.os == 'ubuntu-24.04' && 'xvfb-run -a yarn' || 'yarn' }} ${{ github.event_name == 'workflow_dispatch' && 'test:e2e:update-fixtures' || 'test:e2e' }}
        env:
          CI: true
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Upload written fixtures
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fixtures-${{ matrix.os }}
          path: e2e/fixtures/
          retention-days: 7

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7
